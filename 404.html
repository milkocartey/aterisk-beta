<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#030712">
<title>ATERISK — 404 · Page introuvable</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:#1A2E7A;--blue-mid:#2A45B0;}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;
  height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;
  background:rgba(3,7,18,0.85);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  z-index:50;
}
.nav-logo{
  font-family:'Unbounded',monospace;font-size:16px;font-weight:800;
  letter-spacing:2px;color:white;text-decoration:none;
}
.nav-back{
  font-size:13px;color:rgba(255,255,255,0.45);text-decoration:none;
  transition:color 0.2s;
}
.nav-back:hover{color:white;}

/* ── BODY ── */
body{
  font-family:'DM Sans',sans-serif;
  background:#030712;
  color:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow-x:hidden;
  padding:100px 24px 40px;
  position:relative;
}

/* ── BACKGROUND GLOW + GRID ── */
.bg-glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%, rgba(42,69,176,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(26,46,122,0.18) 0%, transparent 55%);
  animation:glowPulse 10s ease-in-out infinite alternate;
}
@keyframes glowPulse{
  from{background:
    radial-gradient(ellipse 80% 60% at 50% 40%, rgba(42,69,176,0.28) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 20% 80%, rgba(26,46,122,0.18) 0%, transparent 55%);}
  to{background:
    radial-gradient(ellipse 70% 55% at 60% 35%, rgba(42,69,176,0.32) 0%, transparent 65%),
    radial-gradient(ellipse 60% 45% at 80% 70%, rgba(26,46,122,0.20) 0%, transparent 55%);}
}
.bg-grid{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:56px 56px;
}
.bg-noise{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:0.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:200px 200px;
}

/* ── CONTENT ── */
.inner{position:relative;z-index:1;max-width:640px;margin:0 auto;}

/* ── 404 NUMBER ── */
.num-404{
  font-family:'Unbounded',monospace;
  font-size:clamp(80px,15vw,160px);
  font-weight:800;
  line-height:1;
  letter-spacing:-2px;
  background:linear-gradient(135deg,#60A5FA 0%,#818CF8 40%,#A78BFA 70%,#C084FC 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:24px;
  display:block;
  position:relative;
}
.num-404::after{
  content:'404';
  position:absolute;
  inset:0;
  font-family:'Unbounded',monospace;
  font-size:inherit;
  font-weight:800;
  color:rgba(255,255,255,0.03);
  -webkit-background-clip:unset;
  background-clip:unset;
  background:none;
  z-index:-1;
  letter-spacing:-2px;
  line-height:1;
  display:flex;align-items:center;justify-content:center;
}

/* ── SUBTITLE ── */
.title{
  font-family:'DM Serif Display',serif;
  font-size:clamp(22px,4vw,34px);
  font-weight:400;
  color:white;
  margin-bottom:14px;
  line-height:1.3;
}
.title em{font-style:italic;color:#93C5FD;}

.subtitle{
  font-size:16px;
  color:rgba(255,255,255,0.45);
  line-height:1.75;
  max-width:460px;
  margin:0 auto 40px;
}

/* ── BUTTONS ── */
.btns{
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
  margin-bottom:48px;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 28px;border-radius:100px;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
  text-decoration:none;cursor:pointer;border:none;
  transition:all 0.2s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--blue-mid),var(--blue));
  color:white;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
}
.btn-primary:hover{
  background:linear-gradient(135deg,#3B5CC4,#2A45B0);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(42,69,176,0.4);
}
.btn-ghost{
  background:rgba(255,255,255,0.06);
  color:rgba(255,255,255,0.7);
  border:1px solid rgba(255,255,255,0.12);
}
.btn-ghost:hover{
  background:rgba(255,255,255,0.1);
  color:white;
  transform:translateY(-2px);
}

/* ── LIVE INDICATOR ── */
.live-tag{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(255,255,255,0.3);margin-bottom:20px;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:#60A5FA;
  animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.7);}}

/* ── COUNTDOWN ── */
.countdown-line{
  font-size:12px;color:rgba(255,255,255,0.2);
  margin-top:-28px;margin-bottom:28px;
}
.countdown-line span{color:rgba(255,255,255,0.4);font-weight:600;}
</style>
<style>body{opacity:0;transition:none}</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div class="bg-noise"></div>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">ATERISK</a>
  <a href="index.html" class="nav-back">← Retour à l'accueil</a>
</nav>

<!-- CONTENT -->
<div class="inner">
  <div class="live-tag">
    <span class="live-dot"></span>Erreur 404
  </div>

  <span class="num-404">404</span>

  <h1 class="title">Page <em>introuvable</em></h1>
  <p class="subtitle">Cette page n'existe pas ou a été déplacée. Mais ne t'inquiète pas — tes mentors sont toujours là pour t'aider à trouver ce que tu cherches.</p>

  <div class="btns">
    <a href="index.html" class="btn btn-primary">← Retour à l'accueil</a>
    <a href="secteurs.html" class="btn btn-ghost">Voir les mentors</a>
  </div>

  <div class="countdown-line">Redirection automatique dans <span id="countdown">10</span>s</div>
</div>

<script>
let n = 10;
const cd = document.getElementById('countdown');
const t = setInterval(() => {
  cd.textContent = --n;
  if (n <= 0) { clearInterval(t); window.location.href = 'index.html'; }
}, 1000);
document.querySelectorAll('.btn').forEach(a => a.addEventListener('click', () => clearInterval(t)));

// Body opacity restore
requestAnimationFrame(() => requestAnimationFrame(() => {
  document.body.style.opacity = '1';
  document.body.style.transition = 'opacity 0.3s ease';
}));
</script>
<script src="cookie-banner.js"></script>
<script type="module" src="nav.js"></script>
<script type="module" src="motion.js"></script>
</body>
</html>
